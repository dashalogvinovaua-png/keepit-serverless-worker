# СБОРКА ОБРАЗА ВОРКЕРА СВОИМИ СИЛАМИ — БЕСПЛАТНО, НА ЖЕЛЕЗЕ GITHUB.
#
# ЗАЧЕМ ЭТОТ ФАЙЛ ПОЯВИЛСЯ (17.08.2026). Владелица спросила прямо: «зачем RunPod для сборки?».
# Вопрос правильный, и ответ был неудобный: собирать было НЕГДЕ.
#   • на Маке Docker не установлен вовсе;
#   • на сервере фермы 12 ГБ свободного места и 2 ядра, а образ выходит на десятки гигабайт —
#     базовый worker-comfyui с torch/CUDA плюс CosyVoice, DiffRhythm, ReActor, GPEN;
#   • оставался RunPod, который собирает из этого репозитория сам. Но 14.08 сборка застряла в
#     «pending» на двое суток, а ключ фермы шаблоном образа управлять не вправе: список шаблонов
#     приходит пустым, прямой запрос отвечает «не найден». То есть ждать было нечего, а сделать
#     нечем — ровно то состояние, из-за которого заказ от 5 августа пролежал девять дней.
#
# Здесь сборка становится нашей: железо GitHub бесплатное, места на нём хватает после уборки,
# образ уезжает в GHCR — реестр того же репозитория, отдельных ключей не нужно.
name: Сборка образа воркера

on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'handler.py', '.github/workflows/build.yml']
  workflow_dispatch:        # и по кнопке — чтобы пересобрать, ничего не меняя в коде

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # образ тяжёлый; лучше долго, чем оборванная сборка
    permissions:
      contents: read
      packages: write       # право писать в GHCR даётся здесь, чужих ключей не требуется

    steps:
      # МЕСТО. Первая попытка (18.08, прогоны 32103254623 и 32103271772) работала СОРОК МИНУТ
      # и умерла на «No space left on device» — причём умерла так плотно, что бегунок не смог
      # дописать даже собственный журнал, и от сборки не осталось ни строчки лога.
      #
      # Уборки было мало, и вот почему числом: на `/` у бегунка ~73 ГБ, из них после уборки
      # свободно ~50. Наш образ — базовый worker-comfyui с torch и CUDA (это уже ~20 ГБ
      # распакованными) плюс CosyVoice, DiffRhythm, ReActor, GPEN, GFPGAN, antelopev2. Buildkit
      # при сборке держит ОДНОВРЕМЕННО распакованные слои, кэш и итоговый образ — то есть
      # примерно тройной размер. Пятидесяти гигабайт на это не хватает, и не хватило бы никогда:
      # дело не в невезении, а в арифметике.
      #
      # Лечим двумя разными лекарствами, потому что болезнь одна, а запасов места два.
      - name: Освободить место
        run: |
          echo "было:"; df -h / /mnt | tail -3
          # 1. Сносим чужие среды разработки целиком. `hostedtoolcache` теперь весь, а не
          #    только CodeQL: там Python, Node, Go, Ruby нескольких версий — нам не нужен ни один,
          #    сборка идёт ВНУТРИ докера со своими зависимостями.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/lib/jvm /opt/hostedtoolcache /usr/share/swift \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules /opt/az /usr/local/julia* || true
          sudo apt-get clean || true
          sudo docker system prune -af --volumes || true
          echo "стало:"; df -h / /mnt | tail -3

      # 2. СКОЛЬКО МЕСТА ПОЛУЧИЛОСЬ — ГОВОРИМ ЧИСЛОМ И ТРЕБУЕМ ПОРОГ.
      #
      # Здесь стоял переезд докера на отдельный том `/mnt`. Его пришлось снять, и это тот
      # случай, когда заслон отработал ровно как задумано: задание упало на 1-й минуте вместо
      # 40-й, и в отказе лежало число, которое опровергло мою же догадку. У этого бегунка
      # НИКАКОГО `/mnt` нет — корень один и он на 145 ГБ, из них после уборки свободно 122.
      #
      # ЗНАЧИТ ДИАГНОЗ ДРУГОЙ. Первая сборка умерла, имея свободными около 110 ГБ, — то есть
      # образ съедает больше сотни гигабайт, и виноват не бегунок. Виноваты СЛОИ: почти каждый
      # шаг Dockerfile трогает `site-packages` (ставит onnxruntime-gpu поверх onnxruntime,
      # собирает insightface, делает `venv --copies` с полной копией torch), а докер на каждом
      # таком шаге копирует каталог целиком новым слоем. Пятнадцать гигабайт, тронутые шесть
      # раз, — это девяносто гигабайт на диске при итоговом образе вдвое меньше.
      #
      # Уборку оставляем расширенной (она честно дала +35 ГБ), но лечение болезни — в самом
      # Dockerfile, и оно отдано работнику области. Здесь только порог: если свободного меньше
      # 100 ГБ, падаем сразу, а не через сорок минут вслепую.
      - name: Проверить место числом
        run: |
          # ИМЯ ПЕРЕМЕННОЙ ЛАТИНИЦЕЙ, И ЭТО НЕ ПРИДИРКА К СТИЛЮ. bash не считает кириллицу
          # допустимым именем: строка `СВОБОДНО=122` разбирается не как присваивание, а как
          # ИМЯ КОМАНДЫ, и шаг падает с «command not found» — ровно это и случилось в прогоне
          # 32108319467. Комментарии и текст для человека по-русски, имена — латиницей.
          FREE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "свободно на / : ${FREE_GB} ГБ"
          test "$FREE_GB" -ge 100 || { echo "!! меньше 100 ГБ — сборке не хватит, не начинаем"; exit 1; }

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Вход в реестр самого репозитория. GITHUB_TOKEN выдаётся заданию автоматически —
      # ни логина, ни пароля владелицы здесь не хранится и не нужно.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ОБРАЗ СОБИРАЕТСЯ ПОД ТО ЖЕЛЕЗО, ГДЕ ПОЕДЕТ. GPU RunPod — linux/amd64; бегунок GitHub
      # тоже amd64, поэтому эмуляция не нужна и сборка идёт в полную скорость.
      #
      # Меток две. `latest` — та, на которую смотрит эндпоинт. Метка по коммиту — чтобы откат
      # был возможен: «вернуть как было» должно быть одной строкой, а не пересборкой по памяти.
      - name: Собрать и отправить
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Что получилось
        run: |
          echo "образ: ghcr.io/${{ github.repository }}:latest"
          echo "откат: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          df -h / | tail -1
